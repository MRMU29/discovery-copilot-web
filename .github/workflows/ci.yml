name: CI

# §7.5 / v0.3 §8: the project shipped entirely on manual gates. This is the
# minimum check that catches the class of defect the audit found (an undefined
# i18n key, a production-reachable dev route): lint + typecheck + tests + build
# + the repository's own security gate.
on:
  push:
    branches: [main]
  pull_request:

# The verify job only reads the repo; declare it so the default token can't
# exceed that if repository defaults ever change.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests
        run: pnpm test
      - name: Build (catches bundling/asset errors typecheck misses)
        run: pnpm build
      - name: Security gate (keys, sensitive paths, internal docs)
        run: pnpm security:check
